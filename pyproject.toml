[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lohc-storage-ress"
version = "0.1.0"
description = "Cascade (pinch) analysis for self-sufficient PV–LOHC energy systems — Mah et al. (2021)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Parthiv Mehta", email = "parthivmehta2000@gmail.com" }
]
keywords = [
    "LOHC", "dibenzyltoluene", "DBT", "hydrogen storage",
    "pinch analysis", "cascade analysis", "PV", "energy system",
    "self-sufficient", "renewable energy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/Parthiv18122000/LOHC-Storage-RESS"
Issues     = "https://github.com/Parthiv18122000/LOHC-Storage-RESS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]